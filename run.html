<style>
  :root {
    --bg:#FAF8EE; --card:#ffffff; --text:#2b2b2d; --muted:#6b6a70; --accent:#B75736; --accent-2:#8E5E08; --accent-text:#ffffff;
    --line:#e9e5d6; --ok:#2f7d4f; --warn:#b3261e; --shadow:0 10px 40px rgba(58,58,60,.12);
    --app:var(--accent); --app-2:var(--accent-2);
    --glow1:rgba(183,87,54,.16); --glow2:rgba(142,94,8,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --card:#232325; --text:#f2f0ea; --muted:#a6a39b; --accent:#D2704D; --accent-2:#C9962E; --accent-text:#161617;
      --line:#38383b; --ok:#6fd49a; --warn:#ff8a80; --shadow:0 10px 40px rgba(0,0,0,.5);
      --glow1:rgba(210,112,77,.18); --glow2:rgba(201,150,46,.12); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { min-height:100%; background:var(--bg); }
  body {
    margin:0; min-height:100vh; min-height:100dvh; color:var(--text);
    font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
    background:
      radial-gradient(520px 380px at 12% -8%, var(--glow1), transparent 70%),
      radial-gradient(480px 360px at 100% 105%, var(--glow2), transparent 70%),
      var(--bg);
  }
  main { width:100%; max-width:440px; margin:auto 0; }

  /* brand bar */
  .brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:18px; animation:rise .5s ease both; }
  .brand img { width:34px; height:34px; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,.18); }
  .brand span { font-weight:700; letter-spacing:.04em; font-size:15px; text-transform:uppercase; }
  .brand small { display:block; font-weight:500; letter-spacing:.02em; text-transform:none; font-size:12px; color:var(--muted); margin-top:-2px; }

  /* card */
  .card { position:relative; overflow:hidden; background:var(--card); border-radius:28px; padding:0 22px 22px; box-shadow:var(--shadow); text-align:center; animation:rise .55s .05s ease both; }
  .card::before { content:""; position:absolute; inset:0 0 auto 0; height:190px; z-index:0; opacity:.14;
    background:radial-gradient(260px 160px at 50% 0%, var(--app), transparent 75%); }
  .card > * { position:relative; z-index:1; }

  /* hero: app tile with NFC ripples */
  .hero { position:relative; width:132px; height:132px; margin:26px auto 10px; display:grid; place-items:center; }
  .ring { position:absolute; inset:14px; border-radius:50%; border:2px solid var(--app); opacity:0; animation:ripple 2.8s ease-out infinite; }
  .ring.r2 { animation-delay:.9s; } .ring.r3 { animation-delay:1.8s; }
  .tile { position:relative; width:84px; height:84px; border-radius:26px; display:grid; place-items:center; color:#fff; font-size:40px; font-weight:800;
    background:linear-gradient(145deg,var(--app),var(--app-2)); box-shadow:0 12px 28px color-mix(in srgb, var(--app) 45%, transparent), inset 0 1px 0 rgba(255,255,255,.35);
    animation:float 3.6s ease-in-out infinite; }
  .tile svg { width:42px; height:42px; }
  .tile.done { background:linear-gradient(145deg,var(--ok),color-mix(in srgb, var(--ok) 60%, #000)); animation:pop .5s ease both; }
  .tile.done svg path { stroke-dasharray:30; stroke-dashoffset:30; animation:draw .5s .25s ease forwards; }
  .tile.soft { background:var(--line); color:var(--muted); box-shadow:none; animation:none; }
  .badge { position:absolute; right:12px; bottom:14px; width:34px; height:34px; border-radius:50%; background:var(--card); display:grid; place-items:center; box-shadow:0 3px 10px rgba(0,0,0,.2); }
  .badge svg { width:20px; height:20px; color:var(--accent); }

  .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border-radius:99px; font-size:13px; font-weight:600; color:var(--ok);
    background:color-mix(in srgb, var(--ok) 12%, transparent); margin-bottom:12px; }
  .eyebrow i { width:8px; height:8px; border-radius:50%; background:var(--ok); animation:blink 1.6s ease-in-out infinite; }
  h1 { font-size:27px; line-height:1.2; margin:0 0 8px; letter-spacing:-.01em; word-break:break-word; }
  .lead { color:var(--muted); font-size:16px; margin:0 0 22px; }

  /* main button */
  button.go { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:70px; padding:16px;
    border:0; border-radius:22px; font:inherit; font-size:20px; font-weight:700; color:var(--accent-text);
    background:linear-gradient(135deg,var(--app),var(--app-2)); box-shadow:0 10px 24px color-mix(in srgb, var(--app) 42%, transparent);
    cursor:pointer; transition:transform .1s, box-shadow .2s; }
  button.go::after { content:""; position:absolute; top:0; bottom:0; width:60px; left:-80px; transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); animation:shine 3.2s 1s ease-in-out infinite; }
  button.go:active { transform:scale(.97); }
  button.go:focus-visible, a.alt:focus-visible, summary:focus-visible { outline:3px solid color-mix(in srgb, var(--app) 60%, transparent); outline-offset:3px; }
  button.go svg { width:24px; height:24px; flex:none; transition:transform .2s; }
  button.go:hover svg { transform:translateX(3px); }
  button.go.light { --accent-text:var(--text); background:var(--line); box-shadow:none; }

  a.alt { display:block; margin-top:12px; padding:13px; border:1.5px solid var(--line); border-radius:18px; color:var(--text); text-decoration:none; font-size:16px; font-weight:600; transition:background .15s; }
  a.alt:active { background:var(--line); }
  .hint { color:var(--muted); font-size:13.5px; margin:16px 6px 0; }

  /* status messages */
  .status { display:flex; gap:10px; align-items:flex-start; margin-top:16px; padding:13px 14px; border-radius:16px; background:color-mix(in srgb, var(--app) 10%, transparent);
    font-size:16px; text-align:left; word-break:break-word; animation:rise .3s ease both; }
  .status svg { width:20px; height:20px; flex:none; margin-top:2px; }
  .status .body { flex:1; min-width:0; }
  .status.ok { background:color-mix(in srgb, var(--ok) 12%, transparent); }
  .status.ok svg { color:var(--ok); }
  .status.msg { background:var(--bg); border:1.5px solid var(--line); font-size:17px; }
  .status.err { background:color-mix(in srgb, var(--warn) 12%, transparent); color:var(--warn); }
  .status.busy { align-items:center; }
  .status button.go { margin-top:12px; min-height:56px; font-size:18px; }
  .bar { height:4px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; width:40%; border-radius:4px; background:linear-gradient(90deg,var(--app),var(--app-2)); animation:slide 1.1s ease-in-out infinite; }

  /* what will happen */
  details { margin-top:18px; text-align:left; font-size:14.5px; color:var(--muted); }
  summary { cursor:pointer; text-align:center; list-style:none; padding:8px; border-radius:12px; font-weight:600; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"▾"; display:inline-block; margin-left:6px; transition:transform .2s; }
  details[open] summary::after { transform:rotate(180deg); }
  ul { list-style:none; padding:0; margin:8px 0 0; position:relative; }
  li { display:flex; gap:12px; align-items:flex-start; padding:9px 0; }
  li .ic { flex:none; width:30px; height:30px; border-radius:10px; display:grid; place-items:center; background:var(--line); color:var(--muted); }
  li .ic svg { width:17px; height:17px; }
  li .tx { padding-top:3px; word-break:break-word; min-width:0; }
  li.run { color:var(--text); } li.run .ic { background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok); }
  li.skip { color:var(--muted); opacity:.85; }

  /* loading */
  .loading { padding:34px 0 8px; }
  .loading .tile { margin:0 auto 18px; width:72px; height:72px; border-radius:22px; background:none; box-shadow:none; }
  .loading .tile img { width:72px; height:72px; border-radius:50%; animation:breathe 1.6s ease-in-out infinite; }

  /* friendly empty/error screens */
  .empty { padding:30px 0 10px; }
  .empty .hero { margin-top:0; }

  footer { margin-top:22px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:12.5px; color:var(--muted); text-align:center; animation:rise .6s .2s ease both; }
  footer img { width:18px; height:18px; border-radius:50%; }
  footer b { color:var(--text); font-weight:700; }

  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes ripple { 0% { transform:scale(.7); opacity:.55; } 100% { transform:scale(1.35); opacity:0; } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  @keyframes shine { 0%,55% { left:-80px; } 100% { left:120%; } }
  @keyframes slide { 0% { margin-left:-40%; } 100% { margin-left:100%; } }
  @keyframes breathe { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(.92); opacity:.7; } }
  @keyframes pop { 0% { transform:scale(.6); } 70% { transform:scale(1.08); } 100% { transform:scale(1); } }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .ring { display:none; }
    .tile.done svg path { stroke-dashoffset:0; }
  }
</style>
</head>

  var data = null, plan = [], ran = false;

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function icon(name) { var s = document.createElement("span"); s.style.display = "contents"; s.innerHTML = ICON[name] || ""; return s.firstChild; }

  function decode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function minutes(t) {
    var m = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(t || "");
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    return h < 24 && mi < 60 ? h * 60 + mi : null;
  }

  function battery() {
    if (!navigator.getBattery) return Promise.resolve(null);
    return navigator.getBattery().then(function (b) { return b; }, function () { return null; });
  }

  // Resolves to true / false, or null when this browser can't tell.
  function condMet(c) {
    if (!c) return Promise.resolve(true);
    var type = c[0], a = c[1] || "", b = c[2] || "";
    var now = new Date();
    switch (type) {
      case "TIME": {
        var from = minutes(a), to = minutes(b);
        if (from == null || to == null) return Promise.resolve(false);
        var n = now.getHours() * 60 + now.getMinutes();
        return Promise.resolve(from <= to ? (n >= from && n <= to) : (n >= from || n <= to));
      }
      case "DAYS": {
        var names = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        var list = a.split(",").map(function (x) { return x.trim(); });
        return Promise.resolve(list.indexOf(names[now.getDay()]) >= 0);
      }
      case "BATTERY_BELOW": case "BATTERY_ABOVE": case "CHARGING": case "NOT_CHARGING":
        return battery().then(function (bat) {
          if (!bat) return null;
          var pct = Math.round(bat.level * 100), lim = parseInt(a, 10);
          if (type === "BATTERY_BELOW") return isNaN(lim) ? false : pct < lim;
          if (type === "BATTERY_ABOVE") return isNaN(lim) ? false : pct > lim;
          return type === "CHARGING" ? !!bat.charging : !bat.charging;
        });
      case "WIFI": case "NOT_WIFI": {
        var conn = navigator.connection;
        if (!conn || !conn.type) return Promise.resolve(null);
        var wifi = conn.type === "wifi";
        return Promise.resolve(type === "WIFI" ? wifi : !wifi);
      }
      default:
        return Promise.resolve(true);
    }
  }

  function norm(u) { return /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : "https://" + u; }

  // Chrome on Android turns an intent: link into "open this app, else go to the fallback page".
  function intentUrl(u, pkg, fallback, override) {
    var m = /^([a-z][a-z0-9+.-]*):\/\/(.*)$/i.exec(u);
    if (!m || !pkg) return u;
    var scheme = m[1], rest = m[2];
    var fb = override ? override : fallback === "Open Play Store page"
      ? "https://play.google.com/store/apps/details?id=" + pkg
      : (/^https?$/i.test(scheme) ? u : "");
    return "intent://" + rest + "#Intent;scheme=" + scheme + ";package=" + pkg +
      (fb ? ";S.browser_fallback_url=" + encodeURIComponent(fb) : "") + ";end";
  }

  function navUrl(s) {
    var v = s.v || {};
    switch (s.t) {
      case "OPEN_URL": return norm(v.uri || "");
      case "OPEN_IN_APP":
        var u = norm(v.uri || "");
        return isAndroid ? intentUrl(u.replace(/#.*$/, ""), v.package, v.fallback) : u;
      case "CALL": return "tel:" + (v.number || "").replace(/\s+/g, "");
      case "SMS": return "sms:" + (v.number || "").replace(/\s+/g, "") + (v.body ? "?body=" + encodeURIComponent(v.body) : "");
      case "EMAIL": {
        var q = [];
        if (v.subject) q.push("subject=" + encodeURIComponent(v.subject));
        if (v.body) q.push("body=" + encodeURIComponent(v.body));
        return "mailto:" + (v.to || "") + (q.length ? "?" + q.join("&") : "");
      }
      case "MAPS": {
        var loc = (v.query || "").trim();
        return /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(loc) ? "geo:" + loc.replace(/\s+/g, "") : "geo:0,0?q=" + encodeURIComponent(loc);
      }
    }
    return "";
  }

  function describe(s) {
    var v = s.v || {}, t = TITLES[s.t] || s.t;
    var detail = v.uri || v.number || v.to || v.query || v.text || v.seconds || "";
    return t + (detail ? ": " + detail : "");
  }

  var messages = el("div");
  // kind: "" (info), "ok", "err", "msg" (a message the tag owner wants shown), "busy"
  function say(text, cls) {
    var d = el("div", null, "status" + (cls ? " " + cls : ""));
    var ic = cls === "err" ? "WARN" : cls === "ok" ? "CHECK" : cls === "msg" ? "TOAST" : "INFO";
    if (cls !== "busy") d.appendChild(icon(ic));
    var b = el("div", text, "body");
    d.appendChild(b);
    messages.appendChild(d);
    return d;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function goButton(label, light) {
    var b = el("button", null, "go" + (light ? " light" : ""));
    b.type = "button";
    b.appendChild(document.createTextNode(label));
    b.appendChild(icon("ARROW"));
    return b;
  }

  // The big animated tile at the top of the card.
  function hero(inner, opts) {
    opts = opts || {};
    var h = el("div", null, "hero");
    if (!opts.still) { h.appendChild(el("span", null, "ring")); h.appendChild(el("span", null, "ring r2")); h.appendChild(el("span", null, "ring r3")); }
    var t = el("div", null, "tile" + (opts.cls ? " " + opts.cls : ""));
    if (typeof inner === "string") t.textContent = inner; else t.appendChild(inner);
    h.appendChild(t);
    if (opts.badge) { var bd = el("span", null, "badge"); bd.appendChild(icon(opts.badge)); h.appendChild(bd); }
    return h;
  }

  function eyebrow(text) {
    var e = el("div", null, "eyebrow");
    e.appendChild(el("i"));
    e.appendChild(document.createTextNode(text));
    return e;
  }

  function greeting() {
    var h = new Date().getHours();
    return h < 5 ? "Hello there" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  }

  var LIGHT_TINTS = { "Snapchat": 1, "TikTok": 1, "WhatsApp": 1, "Spotify": 1 };
  function setApp(c1, c2, name) {
    var st = document.documentElement.style;
    st.setProperty("--app", c1);
    st.setProperty("--app-2", c2);
    st.setProperty("--accent-text", LIGHT_TINTS[name] ? "#161617" : "#ffffff");
  }

  // Browsers only let a web page open another app right after a tap. Without one, Chrome skips the app and loads
  // the fallback page instead, so opening an app always waits for a tap.
  function hasTap() {
    var ua = navigator.userActivation;
    return !ua || ua.isActive;
  }

  function browserUrl(s) { return norm((s.v || {}).uri || ""); }

  // Chrome (and the OS) hand facebook.com links to the Facebook app. A link Chrome reaches through the "fallback" of an
  // app link stays in the browser, so aim an app link at an app that doesn't exist and let Chrome use the fallback.
  function browserHref(s) {
    var u = browserUrl(s);
    var m = /^(https?):\/\/(.*)$/i.exec(u.replace(/#.*$/, ""));
    if (!isAndroid || !m) return u;
    return "intent://" + m[2] + "#Intent;scheme=" + m[1] + ";package=com.jpfusionlab.nosuchapp;S.browser_fallback_url=" +
      encodeURIComponent(u) + ";end";
  }

  function altLink(s) {
    if (s.t !== "OPEN_IN_APP") return null;
    var a = el("a", "Open in browser instead", "alt");
    a.href = browserHref(s);
    return a;
  }

  // After a tap, tell the person if nothing happened, and offer the browser as the last resort.
  function watchLaunch(s, busyEl) {
    var left = false;
    function gone() { left = true; }
    document.addEventListener("visibilitychange", gone);
    window.addEventListener("pagehide", gone);
    setTimeout(function () {
      if (left || document.hidden) return;
      if (busyEl && busyEl.parentNode) busyEl.parentNode.removeChild(busyEl);
      say("Nothing opened yet. Tap the button to try again.", "err");
      var a = altLink(s);
      if (a) messages.appendChild(a);
    }, 2500);
  }

  function launch(s, url) {
    window.__lastNav = url;
    if (window.__NO_NAV) return;
    var busy = say("", "busy");
    var body = busy.querySelector(".body");
    var nm = s.t === "OPEN_IN_APP" ? appName(s) : "";
    body.appendChild(document.createTextNode(nm && nm !== "the app" ? "Opening " + nm + "…" : "Opening…"));
    var bar = el("div", null, "bar"); bar.appendChild(el("i")); body.appendChild(bar);
    window.location.href = url;
    watchLaunch(s, busy);
  }

  function markDone() {
    var t = card.querySelector(".tile");
    if (!t || t.classList.contains("done")) return;
    t.className = "tile done";
    t.replaceChildren(icon("CHECK"));
    var rings = card.querySelectorAll(".ring");
    for (var i = 0; i < rings.length; i++) rings[i].style.display = "none";
    var e = card.querySelector(".eyebrow");
    if (e) { e.lastChild.textContent = "All done"; }
  }

  async function run() {
    ran = true;
    for (var i = 0; i < plan.length; i++) {
      var p = plan[i], s = p.step;
      if (!p.go) continue;
      if (s.t === "STOP") { say("Stopped."); return; }
      if (NAV[s.t]) {
        var url = navUrl(s);
        if (!url) { say("This step has no address.", "err"); return; }
        if (!hasTap()) {
          var again = goButton("Tap to continue");
          again.addEventListener("click", function () { messages.replaceChildren(); launch(s, url); });
          var box = el("div", null, "status");
          var bx = el("div", null, "body");
          bx.appendChild(el("div", "One more tap to open it."));
          bx.appendChild(again);
          box.appendChild(bx);
          messages.appendChild(box);
          return;
        }
        launch(s, url);
        return; // only the first opening step can run
      }
      var v = s.v || {};
      if (s.t === "TOAST") say(v.text || "", "msg");
      else if (s.t === "CLIPBOARD") {
        try { await navigator.clipboard.writeText(v.text || ""); say("Copied to clipboard.", "ok"); }
        catch (e) { say("Couldn't copy automatically. Tap the button to try again.", "err"); }
      }
      else if (s.t === "VIBRATE") { if (navigator.vibrate) navigator.vibrate(Math.min(3000, +v.ms || 300)); }
      else if (s.t === "DELAY") await sleep(Math.min(120, +v.seconds || 1) * 1000);
    }
    markDone();
  }

  function showMessage(title, text, ic) {
    var w = el("div", null, "empty");
    w.appendChild(hero(icon(ic || "WAVES"), { cls: "soft", still: true }));
    w.appendChild(el("h1", title));
    w.appendChild(el("p", text, "lead"));
    card.replaceChildren(w);
  }

  async function init() {
    var h = location.hash.slice(1);
    if (!h) { showMessage("Tap a tag to begin", "This page runs when you tap an NFC tag. Hold your phone against the tag and it will open here.", "WAVES"); return; }
    try { data = decode(h); } catch (e) { showMessage("This tag needs a refresh", "The link looks damaged. Ask the tag owner to rewrite it, then tap again.", "WARN"); return; }
    var steps = data.s || [];
    for (var i = 0; i < steps.length; i++) {
      var ok = await condMet(steps[i].c);
      plan.push({ step: steps[i], go: ok === true, unknown: ok === null });
    }
    window.__plan = plan.map(function (p) { return (p.go ? "RUN " : "SKIP ") + describe(p.step); });

    var firstNav = null;
    plan.forEach(function (p) { if (!firstNav && p.go && NAV[p.step.t]) firstNav = p.step; });

    var title, lead, label, heroEl, nm = "";
    if (!firstNav) {
      title = data.n || "Workflow"; lead = "Your tag is doing its thing."; label = "Run again";
      var anyMsg = null;
      plan.forEach(function (p) { if (!anyMsg && p.go && !NAV[p.step.t] && ICON[p.step.t]) anyMsg = p.step.t; });
      heroEl = hero(icon(anyMsg || "WAVES"), { badge: "WAVES" });
    } else if (firstNav.t === "OPEN_IN_APP") {
      nm = appName(firstNav);
      title = data.n || "Ready";
      lead = nm === "the app" ? "Tap below to open the app." : "Tap below to open " + nm + ".";
      label = nm === "the app" ? "Open app" : "Open " + nm;
      var col = APP_COLORS[nm];
      if (col) setApp(col[0], col[1], nm);
      heroEl = hero(nm === "the app" ? icon("OPEN_IN_APP") : nm.charAt(0).toUpperCase(), { badge: "OPEN_IN_APP" });
    } else {
      title = data.n || "Ready"; lead = "Tap the button to continue."; label = "Continue";
      heroEl = hero(icon(firstNav.t), { badge: "WAVES" });
    }

    card.replaceChildren(heroEl, eyebrow(greeting() + " · tag detected"), el("h1", title), el("p", lead, "lead"));
    var btn = goButton(label);
    btn.addEventListener("click", function () { messages.replaceChildren(); run(); });
    card.appendChild(btn);
    if (firstNav) {
      var alt = altLink(firstNav);
      if (alt) card.appendChild(alt);
      card.appendChild(el("p", "Your phone asks for one tap before a web page can open another app.", "hint"));
    }
    card.appendChild(messages);

    var d = el("details");
    d.appendChild(el("summary", "What will happen"));
    var ul = el("ul");
    var opening = false;
    plan.forEach(function (p) {
      var line = describe(p.step), li, cls;
      if (p.go && NAV[p.step.t] && opening) { li = el("li", null, "skip"); line = line + " (only the first opening step runs)"; }
      else if (p.go) { li = el("li", null, "run"); if (NAV[p.step.t]) opening = true; }
      else { li = el("li", null, "skip"); line = line + (p.unknown ? " (this browser can't check the condition)" : " (condition not met)"); }
      var ic = el("span", null, "ic");
      ic.appendChild(icon(li.className === "run" ? "CHECK" : (ICON[p.step.t] ? p.step.t : "INFO")));
      li.appendChild(ic);
      li.appendChild(el("span", line, "tx"));
      ul.appendChild(li);
    });
    d.appendChild(ul);
    card.appendChild(d);

    // Try the app once without a tap. Chrome may refuse that, and then it loads the fallback, which here is this
    // same page (marked r=1) so it shows the button instead of the website. If it works, no tap is needed.
    if (firstNav && firstNav.t === "OPEN_IN_APP" && isAndroid && !/[?&]r=1/.test(location.search) && !window.__NO_AUTORUN) {
      var v0 = firstNav.v || {};
      var self = location.origin + location.pathname + "?r=1" + location.hash;
      var auto = intentUrl(norm(v0.uri || "").replace(/#.*$/, ""), v0.package, v0.fallback, self);
      setTimeout(function () { window.__lastAuto = auto; if (!window.__NO_NAV) window.location.replace(auto); }, 200);
    }

    if (!firstNav && !window.__NO_AUTORUN) setTimeout(function () { if (!ran) run(); }, 300);
  }

  // Saves a copy of this page on the phone (see sw.js) so tags keep working offline or if the site is down.
  if ("serviceWorker" in navigator && location.protocol === "https:" || location.hostname === "localhost") {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  }

  init();
})();
</script>
</body>
</html>
