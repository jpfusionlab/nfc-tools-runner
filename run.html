<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAF8EE">
<title>NFC Tag Runner</title>
<style>
  :root { --bg:#FAF8EE; --card:#ffffff; --text:#2b2b2d; --muted:#6b6a70; --accent:#B75736; --accent-2:#8E5E08; --accent-text:#ffffff; --line:#e9e5d6; --ok:#2f7d4f; --warn:#b3261e; --shadow:0 6px 24px rgba(58,58,60,.10); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --card:#232325; --text:#f2f0ea; --muted:#a6a39b; --accent:#D2704D; --accent-2:#C9962E; --accent-text:#161617; --line:#38383b; --ok:#6fd49a; --warn:#ff8a80; --shadow:0 6px 24px rgba(0,0,0,.4); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px 16px 28px; }
  main { width:100%; max-width:440px; margin:auto 0; }
  .brand { display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:18px; text-align:center; }
  .brand b { font-size:20px; letter-spacing:.02em; }
  .card { background:var(--card); border-radius:24px; padding:26px 22px 22px; box-shadow:var(--shadow); text-align:center; }
  h1 { font-size:24px; line-height:1.25; margin:0 0 6px; word-break:break-word; }
  .lead { color:var(--muted); font-size:16px; margin:0 0 20px; }
  button.go { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:68px; padding:16px; border:0; border-radius:20px; font:inherit; font-size:20px; font-weight:700; color:var(--accent-text); background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 8px 20px color-mix(in srgb, var(--accent) 40%, transparent); cursor:pointer; transition:transform .08s; }
  button.go:active { transform:scale(.98); }
  button.go svg { width:24px; height:24px; flex:none; }
  a.alt { display:block; margin-top:14px; padding:12px; border:1.5px solid var(--line); border-radius:16px; color:var(--text); text-decoration:none; font-size:16px; font-weight:600; }
  .hint { color:var(--muted); font-size:14px; margin:16px 4px 0; }
  .status { margin-top:16px; padding:12px 14px; border-radius:14px; background:color-mix(in srgb, var(--accent) 10%, transparent); font-size:16px; text-align:left; word-break:break-word; }
  .status.ok { background:color-mix(in srgb, var(--ok) 12%, transparent); }
  .status.err { background:color-mix(in srgb, var(--warn) 12%, transparent); color:var(--warn); }
  .status button.go { margin-top:12px; min-height:56px; font-size:18px; }
  details { margin-top:18px; text-align:left; font-size:14px; color:var(--muted); }
  summary { cursor:pointer; text-align:center; list-style:none; padding:6px; }
  summary::-webkit-details-marker { display:none; }
  ul { list-style:none; padding:0; margin:8px 0 0; }
  li { padding:7px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  li.run { color:var(--ok); } li.skip { color:var(--muted); }
  .spin { width:34px; height:34px; margin:4px auto 14px; border:4px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
  footer { margin-top:18px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <b>NFC Tag Runner</b>
  </div>
  <div class="card" id="card" aria-live="polite"><div class="spin" aria-hidden="true"></div><p class="lead">Getting ready…</p></div>
</main>
<script>
(function () {
  "use strict";
  var NAV = { OPEN_URL: 1, OPEN_IN_APP: 1, CALL: 1, SMS: 1, EMAIL: 1, MAPS: 1 };
  var TITLES = {
    OPEN_URL: "Open link", OPEN_IN_APP: "Open link in app", CALL: "Dial number", SMS: "Compose text",
    EMAIL: "Compose email", MAPS: "Open map", CLIPBOARD: "Copy to clipboard", TOAST: "Show message",
    VIBRATE: "Vibrate", DELAY: "Wait", STOP: "Stop"
  };
  var APPS = {
    "com.facebook.katana": "Facebook", "com.facebook.orca": "Messenger", "com.instagram.android": "Instagram",
    "com.google.android.youtube": "YouTube", "com.whatsapp": "WhatsApp", "com.zhiliaoapp.musically": "TikTok",
    "com.ss.android.ugc.trill": "TikTok", "com.twitter.android": "X", "com.spotify.music": "Spotify",
    "com.google.android.apps.maps": "Maps", "org.telegram.messenger": "Telegram", "com.viber.voip": "Viber",
    "com.shopee.ph": "Shopee", "com.lazada.android": "Lazada", "com.linkedin.android": "LinkedIn",
    "com.reddit.frontpage": "Reddit", "com.snapchat.android": "Snapchat", "com.discord": "Discord"
  };
  function appName(s) {
    var v = s.v || {};
    if (APPS[v.package]) return APPS[v.package];
    var m = /^(?:[a-z][a-z0-9+.-]*:\/\/)?(?:www\.|m\.)?([^\/?#:]+)/i.exec(v.uri || "");
    if (m && /\./.test(m[1])) { var n = m[1].split(".")[0]; return n.charAt(0).toUpperCase() + n.slice(1); }
    return "the app";
  }
  var isAndroid = /Android/i.test(navigator.userAgent);
  var card = document.getElementById("card");
  var data = null, plan = [], ran = false;

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  function decode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function minutes(t) {
    var m = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(t || "");
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    return h < 24 && mi < 60 ? h * 60 + mi : null;
  }

  function battery() {
    if (!navigator.getBattery) return Promise.resolve(null);
    return navigator.getBattery().then(function (b) { return b; }, function () { return null; });
  }

  // Resolves to true / false, or null when this browser can't tell.
  function condMet(c) {
    if (!c) return Promise.resolve(true);
    var type = c[0], a = c[1] || "", b = c[2] || "";
    var now = new Date();
    switch (type) {
      case "TIME": {
        var from = minutes(a), to = minutes(b);
        if (from == null || to == null) return Promise.resolve(false);
        var n = now.getHours() * 60 + now.getMinutes();
        return Promise.resolve(from <= to ? (n >= from && n <= to) : (n >= from || n <= to));
      }
      case "DAYS": {
        var names = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        var list = a.split(",").map(function (x) { return x.trim(); });
        return Promise.resolve(list.indexOf(names[now.getDay()]) >= 0);
      }
      case "BATTERY_BELOW": case "BATTERY_ABOVE": case "CHARGING": case "NOT_CHARGING":
        return battery().then(function (bat) {
          if (!bat) return null;
          var pct = Math.round(bat.level * 100), lim = parseInt(a, 10);
          if (type === "BATTERY_BELOW") return isNaN(lim) ? false : pct < lim;
          if (type === "BATTERY_ABOVE") return isNaN(lim) ? false : pct > lim;
          return type === "CHARGING" ? !!bat.charging : !bat.charging;
        });
      case "WIFI": case "NOT_WIFI": {
        var conn = navigator.connection;
        if (!conn || !conn.type) return Promise.resolve(null);
        var wifi = conn.type === "wifi";
        return Promise.resolve(type === "WIFI" ? wifi : !wifi);
      }
      default:
        return Promise.resolve(true);
    }
  }

  function norm(u) { return /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : "https://" + u; }

  // Chrome on Android turns an intent: link into "open this app, else go to the fallback page".
  function intentUrl(u, pkg, fallback, override) {
    var m = /^([a-z][a-z0-9+.-]*):\/\/(.*)$/i.exec(u);
    if (!m || !pkg) return u;
    var scheme = m[1], rest = m[2];
    var fb = override ? override : fallback === "Open Play Store page"
      ? "https://play.google.com/store/apps/details?id=" + pkg
      : (/^https?$/i.test(scheme) ? u : "");
    return "intent://" + rest + "#Intent;scheme=" + scheme + ";package=" + pkg +
      (fb ? ";S.browser_fallback_url=" + encodeURIComponent(fb) : "") + ";end";
  }

  function navUrl(s) {
    var v = s.v || {};
    switch (s.t) {
      case "OPEN_URL": return norm(v.uri || "");
      case "OPEN_IN_APP":
        var u = norm(v.uri || "");
        return isAndroid ? intentUrl(u.replace(/#.*$/, ""), v.package, v.fallback) : u;
      case "CALL": return "tel:" + (v.number || "").replace(/\s+/g, "");
      case "SMS": return "sms:" + (v.number || "").replace(/\s+/g, "") + (v.body ? "?body=" + encodeURIComponent(v.body) : "");
      case "EMAIL": {
        var q = [];
        if (v.subject) q.push("subject=" + encodeURIComponent(v.subject));
        if (v.body) q.push("body=" + encodeURIComponent(v.body));
        return "mailto:" + (v.to || "") + (q.length ? "?" + q.join("&") : "");
      }
      case "MAPS": {
        var loc = (v.query || "").trim();
        return /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(loc) ? "geo:" + loc.replace(/\s+/g, "") : "geo:0,0?q=" + encodeURIComponent(loc);
      }
    }
    return "";
  }

  function describe(s) {
    var v = s.v || {}, t = TITLES[s.t] || s.t;
    var detail = v.uri || v.number || v.to || v.query || v.text || v.seconds || "";
    return t + (detail ? ": " + detail : "");
  }

  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var messages = el("div");
  function say(text, cls) { messages.appendChild(el("div", text, "status" + (cls ? " " + cls : ""))); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function goButton(label) {
    var b = el("button", null, "go");
    b.type = "button";
    b.innerHTML = ARROW;
    b.insertBefore(document.createTextNode(label), b.firstChild);
    return b;
  }

  // Browsers only let a web page open another app right after a tap. Without one, Chrome skips the app and loads
  // the fallback page instead, so opening an app always waits for a tap.
  function hasTap() {
    var ua = navigator.userActivation;
    return !ua || ua.isActive;
  }

  function browserUrl(s) { return norm((s.v || {}).uri || ""); }

  // Chrome hands facebook.com links to the Facebook app, so on Android this aims the link at Chrome itself.
  function browserHref(s) {
    var u = browserUrl(s);
    var m = /^(https?):\/\/(.*)$/i.exec(u.replace(/#.*$/, ""));
    if (!isAndroid || !m) return u;
    return "intent://" + m[2] + "#Intent;scheme=" + m[1] + ";package=com.android.chrome;S.browser_fallback_url=" +
      encodeURIComponent(u) + ";end";
  }

  function altLink(s) {
    if (s.t !== "OPEN_IN_APP") return null;
    var a = el("a", "Open in browser instead", "alt");
    a.href = browserHref(s);
    return a;
  }

  // After a tap, tell the person if nothing happened, and offer the browser as the last resort.
  function watchLaunch(s) {
    var left = false;
    function gone() { left = true; }
    document.addEventListener("visibilitychange", gone);
    window.addEventListener("pagehide", gone);
    setTimeout(function () {
      if (left || document.hidden) return;
      say("Nothing opened yet. Tap the button to try again.", "err");
      var a = altLink(s);
      if (a) messages.appendChild(a);
    }, 2500);
  }

  function launch(s, url) {
    window.__lastNav = url;
    if (window.__NO_NAV) return;
    window.location.href = url;
    watchLaunch(s);
  }

  async function run() {
    ran = true;
    for (var i = 0; i < plan.length; i++) {
      var p = plan[i], s = p.step;
      if (!p.go) continue;
      if (s.t === "STOP") { say("Stopped."); return; }
      if (NAV[s.t]) {
        var url = navUrl(s);
        if (!url) { say("This step has no address.", "err"); return; }
        if (!hasTap()) {
          var again = goButton("Tap to continue");
          again.addEventListener("click", function () { messages.replaceChildren(); launch(s, url); });
          var box = el("div", null, "status");
          box.appendChild(el("div", "One more tap to open it."));
          box.appendChild(again);
          messages.appendChild(box);
          return;
        }
        launch(s, url);
        return; // only the first opening step can run
      }
      var v = s.v || {};
      if (s.t === "TOAST") say(v.text || "", "ok");
      else if (s.t === "CLIPBOARD") {
        try { await navigator.clipboard.writeText(v.text || ""); say("Copied to clipboard.", "ok"); }
        catch (e) { say("Couldn't copy automatically. Tap the button to try again.", "err"); }
      }
      else if (s.t === "VIBRATE") { if (navigator.vibrate) navigator.vibrate(Math.min(3000, +v.ms || 300)); }
      else if (s.t === "DELAY") await sleep(Math.min(120, +v.seconds || 1) * 1000);
    }
  }

  function showMessage(title, text) {
    card.replaceChildren(el("h1", title), el("p", text, "lead"));
  }

  async function init() {
    var h = location.hash.slice(1);
    if (!h) { showMessage("Nothing to run here", "Write a web tag from the NFC Tools Editor app, then tap it to open this page."); return; }
    try { data = decode(h); } catch (e) { showMessage("This link looks damaged", "Rewrite the tag from the NFC Tools Editor app."); return; }
    var steps = data.s || [];
    for (var i = 0; i < steps.length; i++) {
      var ok = await condMet(steps[i].c);
      plan.push({ step: steps[i], go: ok === true, unknown: ok === null });
    }
    window.__plan = plan.map(function (p) { return (p.go ? "RUN " : "SKIP ") + describe(p.step); });

    var firstNav = null;
    plan.forEach(function (p) { if (!firstNav && p.go && NAV[p.step.t]) firstNav = p.step; });

    var title, lead, label;
    if (!firstNav) {
      title = data.n || "Workflow"; lead = "Your tag ran."; label = "Run again";
    } else if (firstNav.t === "OPEN_IN_APP") {
      var nm = appName(firstNav);
      title = data.n || "Ready";
      lead = nm === "the app" ? "Tap below to open the app." : "Tap below to open " + nm + ".";
      label = nm === "the app" ? "Open app" : "Open " + nm;
    } else {
      title = data.n || "Ready"; lead = "Tap the button to continue."; label = "Continue";
    }

    card.replaceChildren(el("h1", title), el("p", lead, "lead"));
    var btn = goButton(label);
    btn.addEventListener("click", function () { messages.replaceChildren(); run(); });
    card.appendChild(btn);
    if (firstNav) {
      var alt = altLink(firstNav);
      if (alt) card.appendChild(alt);
      card.appendChild(el("p", "Your phone asks for one tap before a web page can open another app.", "hint"));
    }
    card.appendChild(messages);

    var d = el("details");
    d.appendChild(el("summary", "What will happen"));
    var ul = el("ul");
    var opening = false;
    plan.forEach(function (p) {
      var line = describe(p.step), li;
      if (p.go && NAV[p.step.t] && opening) li = el("li", "– " + line + " (only the first opening step runs)", "skip");
      else if (p.go) { li = el("li", "✓ " + line, "run"); if (NAV[p.step.t]) opening = true; }
      else li = el("li", "– " + line + (p.unknown ? " (this browser can't check the condition)" : " (condition not met)"), "skip");
      ul.appendChild(li);
    });
    d.appendChild(ul);
    card.appendChild(d);

    // Try the app once without a tap. Chrome may refuse that, and then it loads the fallback, which here is this
    // same page (marked r=1) so it shows the button instead of the website. If it works, no tap is needed.
    if (firstNav && firstNav.t === "OPEN_IN_APP" && isAndroid && !/[?&]r=1/.test(location.search) && !window.__NO_AUTORUN) {
      var v0 = firstNav.v || {};
      var self = location.origin + location.pathname + "?r=1" + location.hash;
      var auto = intentUrl(norm(v0.uri || "").replace(/#.*$/, ""), v0.package, v0.fallback, self);
      setTimeout(function () { window.__lastAuto = auto; if (!window.__NO_NAV) window.location.replace(auto); }, 200);
    }

    if (!firstNav && !window.__NO_AUTORUN) setTimeout(function () { if (!ran) run(); }, 300);
  }

  // Saves a copy of this page on the phone (see sw.js) so tags keep working offline or if the site is down.
  if ("serviceWorker" in navigator && location.protocol === "https:" || location.hostname === "localhost") {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  }

  init();
})();
</script>
</body>
</html>
